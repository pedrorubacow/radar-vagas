name: radar de vagas

on:
  schedule:
    # 09:00 em Sao Paulo (UTC-3) = 12:00 UTC, de segunda a sexta
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      diagnostico:
        description: "Modo diagnostico: lista tudo e nao envia nada"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar o radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MODO_DIAGNOSTICO: ${{ inputs.diagnostico }}
        run: python src/radar.py

      - name: Guardar o que ja foi enviado
        if: ${{ !inputs.diagnostico }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add vistos.json
          git diff --staged --quiet || git commit -m "chore: atualiza vistos"
          git push
